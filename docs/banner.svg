<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="1" stop-color="#15306b"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a9a52"/>
      <stop offset="1" stop-color="#b7a86c"/>
    </linearGradient>
    <clipPath id="mapClip"><rect x="860" y="60" width="670" height="440" rx="24"/></clipPath>
    <clipPath id="thumbClip"><rect x="1111" y="109" width="204" height="124" rx="8"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1736" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="560" rx="28" fill="url(#sky)"/>
  <rect width="1600" height="560" rx="28" fill="url(#dots)"/>

  <!-- Left: name, pitch, features, stack -->
  <text x="90" y="150" fill="#7dd3fc" font-size="19" font-weight="600" letter-spacing="3">INTERNAL TOOL · AIRSHIP OPERATIONS</text>
  <text x="86" y="250" fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-1">Photo map</text>
  <text x="90" y="310" fill="#cbd5e1" font-size="30">Geotagged photos on a shared map, for teams</text>
  <text x="90" y="350" fill="#cbd5e1" font-size="30">that inspect infrastructure from the air.</text>

  <g font-size="19" fill="#e2e8f0">
    <rect x="90" y="388" width="262" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="221" y="417" text-anchor="middle">GPS read from the photo</text>
    <rect x="366" y="388" width="176" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="454" y="417" text-anchor="middle">Team comments</text>
    <rect x="556" y="388" width="230" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="671" y="417" text-anchor="middle">AI inspection notes</text>
  </g>
  <text x="90" y="490" fill="#94a3b8" font-size="18">Next.js · PostgreSQL · MapLibre · Amazon Bedrock</text>

  <!-- Right: the map -->
  <g filter="url(#shadow)">
    <rect x="860" y="60" width="670" height="440" rx="24" fill="#eef1e4"/>
  </g>
  <g clip-path="url(#mapClip)">
    <!-- fields, forest and a lake -->
    <path d="M860 60 H1120 L1040 200 L860 230 Z" fill="#d5e8bf"/>
    <path d="M1300 60 H1530 V250 L1420 210 Z" fill="#c4dfa8"/>
    <path d="M1180 60 L1300 60 L1250 150 L1160 140 Z" fill="#a9d08c"/>
    <path d="M860 330 L1010 300 L1080 500 H860 Z" fill="#cfe5b8"/>
    <path d="M1420 360 L1530 330 V500 H1360 Z" fill="#d9ebc6"/>
    <path d="M905 395 C930 360 1000 365 1015 400 C1030 440 975 470 940 455 C910 445 890 420 905 395 Z" fill="#a8d4ef"/>
    <!-- a road -->
    <path d="M860 438 C1040 400 1200 470 1530 352" fill="none" stroke="#d8d3c3" stroke-width="20"/>
    <path d="M860 438 C1040 400 1200 470 1530 352" fill="none" stroke="#ffffff" stroke-width="13"/>
    <!-- the railway -->
    <path d="M850 92 L1545 482" fill="none" stroke="#dcd8cd" stroke-width="30"/>
    <path d="M850 92 L1545 482" fill="none" stroke="#5b6472" stroke-width="7"/>
    <path d="M850 92 L1545 482" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 10"/>
    <!-- the flight path -->
    <path d="M1384 152 C1300 200 1180 120 1060 160 S920 215 880 175" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13"/>
    <!-- photo markers -->
    <g fill="#64748b" stroke="#ffffff" stroke-width="4">
      <circle cx="958" cy="153" r="11"/>
      <circle cx="1072" cy="218" r="11"/>
      <circle cx="1238" cy="310" r="11"/>
      <circle cx="1360" cy="380" r="11"/>
      <circle cx="1458" cy="434" r="11"/>
    </g>
    <!-- the photo being uploaded: a hollow pin -->
    <circle cx="1140" cy="330" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>
    <!-- the selected photo -->
    <circle cx="1213" cy="297" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- the card above the selected photo -->
  <g filter="url(#shadow)">
    <rect x="1103" y="101" width="220" height="168" rx="14" fill="#ffffff"/>
    <path d="M1199 268 L1227 268 L1213 284 Z" fill="#ffffff"/>
  </g>
  <g clip-path="url(#thumbClip)">
    <rect x="1111" y="109" width="204" height="124" fill="url(#field)"/>
    <path d="M1111 150 L1315 128 V170 L1111 196 Z" fill="#7d838b"/>
    <path d="M1111 160 L1315 137" stroke="#d1d5db" stroke-width="2.5"/>
    <path d="M1111 172 L1315 149" stroke="#d1d5db" stroke-width="2.5"/>
    <path d="M1111 182 L1315 158" stroke="#d1d5db" stroke-width="2.5"/>
    <path d="M1111 190 L1315 166" stroke="#d1d5db" stroke-width="2.5"/>
    <path d="M1111 109 H1315 V130 L1111 146 Z" fill="#9aa65c" fill-opacity="0.6"/>
  </g>
  <text x="1115" y="256" fill="#0f172a" font-size="17" font-weight="600">DSC00751.JPG</text>

  <!-- the airship, flying left along the line; tail fins drawn first so the hull covers their base -->
  <g filter="url(#shadow)">
    <path d="M1478 100 L1514 78 L1518 104 Z" fill="#1e3a8a"/>
    <path d="M1478 132 L1514 154 L1518 128 Z" fill="#1e3a8a"/>
    <ellipse cx="1420" cy="116" rx="86" ry="26" fill="url(#hull)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M1352 110 C1390 103 1450 103 1492 110" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9"/>
    <rect x="1394" y="140" width="40" height="12" rx="6" fill="#1e3a8a"/>
    <circle cx="1388" cy="146" r="4.5" fill="#22d3ee"/>
  </g>
</svg>
